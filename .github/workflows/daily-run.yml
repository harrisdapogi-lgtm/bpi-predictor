name: 🔮 BPI Predictor + Dashboard Update

on:
  schedule:
    - cron: "0 2 * * *"  # Runs daily at 10 AM PH time (2 AM UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas numpy tensorflow scikit-learn matplotlib yfinance

      - name: Run BPI predictor
        run: |
          echo "🚀 Running BPI predictor..."
          python bpi_predictor.py

      - name: Commit new prediction logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/*.csv || echo "No logs to add"
          git commit -m "📈 Daily prediction update $(date -u)" || echo "No changes to commit"
          git push

  analyze:
    needs: predict
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas matplotlib

      - name: Run analysis + generate dashboard
        run: python analyze_predictions.py

      - name: Upload dashboard as GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: analysis/

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
