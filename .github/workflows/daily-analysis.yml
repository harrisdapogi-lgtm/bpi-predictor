name: 📊 Daily Comparison Report

on:
  schedule:
    - cron: "0 2 * * *"  # Runs daily at 10 AM PH time (2 AM UTC)
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas matplotlib

      - name: Run analysis script
        run: python analyze_predictions.py

      - name: Commit and push analysis results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/*.html
          git commit -m "📊 Daily analysis report $(date -u)" || echo "No changes to commit"
          git push

